app:
  frontend-url: https://t-meta-service.vsaidt.com
  cors:
    allowed-origins: https://t-meta-service.vsaidt.com,http://localhost:5173,http://localhost:5174

# ===== SuperPlatform Auth (SSO) =====
spring.security.oauth2.resourceserver.jwt:
  jwk-set-uri: https://t-auth-api.vschool.at/.well-known/jwks.json
  issuer-uri: superplatform

superplatform:
  auth:
    server-url: https://t-auth-api.vschool.at
    client-id: ${SP_AUTH_CLIENT_ID:test-service}
    client-secret: ${SP_AUTH_CLIENT_SECRET:test-secret-1234!}
    # internal-api.base-url 은 공통 application.yml 에서 server-url 기반으로 자동 derive.

# ===== QCH 적재 (dev) =====
qch:
  enabled: ${QCH_ENABLED:true}
  base-url: ${QCH_BASE_URL:https://t-qch.vsaidt.com}
  service-key: ${QCH_SERVICE_KEY:meta-api}
  env: ${QCH_ENV:dev}

# ===== 알림 Pub/Sub + ShedLock (dev: Redis 사용 / 분산 스케줄러 락) =====
# 개발서버 Redis Pub/Sub 동작 검증용으로 dev profile에서 켜둠.
# Redis 접속 정보(STAT_SPRING_REDIS_HOST 등)는 컨테이너 환경변수로 주입.
# ShedLock 은 MySQL `shedlock` 테이블 기반 — dev 에 선행 생성 완료 가정.
notification:
  pubsub:
    enabled: true
  shedlock:
    enabled: true

# ===== SSO 이벤트 폴링 (dev: ON) =====
# 사전조건: sso_poll_cursor 테이블 초기 INSERT + IdP events:read scope 부여.
sso:
  poll:
    enabled: true

# ===== IDP 그룹 동기화 (dev: ON) — group-from-idp =====
# 사전조건: migrations/01-sync-prep.sql 적용(sp_group_id/provisioned/GROUP_CHANGES 커서)
#          + IdP oauth2_client 에 groups:read scope 부여.
# 부트스트랩(커서 NULL) → 1분 폴링 → 일1회(04시) 전체 재동기화. ShedLock 으로 단일 인스턴스 실행.
group-sync:
  enabled: true

# /actuator/health 응답에 components 상세 노출 (dev 진단용).
# prod 는 base default(never) 유지.
management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true

# ===== Redis username override (dev 진단용 — 임시) =====
# 현상: NCP Cloud DB Redis 부팅 시 WRONGPASS 발생.
# 가설: 컨테이너에 주입된 STAT_SPRING_REDIS_USERNAME 가 NCP ACL 에 없는 값이라
#       Lettuce 가 AUTH <user> <pass> 를 보내고 서버가 거부.
# 조치: dev profile 에서 username 을 빈 문자열로 강제 → password-only AUTH 경로로 시도.
# 결과 확인 후 환경변수 정리되면 본 블록 제거.
spring:
  data:
    redis:
      username: ""
