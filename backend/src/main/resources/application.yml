# Global Settings
application:
  title: Meta API
  version: 1.0.0

service:
  name: ${META_API_SERVICE_NAME:meta-api}

# 서버 설정
server:
  shutdown: graceful
  port: '8081'
  tomcat:
    max-swallow-size: -1
    connection-timeout: 300s
    mbeanregistry:
      enabled: true

spring:
  profiles:
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Seoul
  # 데이터베이스 설정
  datasource:
    hikari:
      auto-commit: false
      connection-test-query: "SELECT 1"
      pool-name: hikari-cp
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 0
      master:
        driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
        jdbc-url: ${META_API_DATASOURCE_MASTER_URL}
        username: ${META_API_DATASOURCE_MASTER_USERNAME}
        password: ${META_API_DATASOURCE_MASTER_PASSWORD}
        pool-name: hikari-cp
        maximum-pool-size: 50
        minimum-idle: 10
      slave:
        driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
        jdbc-url: ${META_API_DATASOURCE_SLAVE_URL}
        username: ${META_API_DATASOURCE_SLAVE_USERNAME}
        password: ${META_API_DATASOURCE_SLAVE_PASSWORD}
        pool-name: hikari-cp
        maximum-pool-size: 50
        minimum-idle: 10
  # Redis 설정 (알림 SSE Pub/Sub 용도)
  redis:
    host: ${STAT_SPRING_REDIS_HOST:localhost}
    port: ${STAT_SPRING_REDIS_PORT:6379}
    username: ${STAT_SPRING_REDIS_USERNAME:}
    password: ${STAT_SPRING_REDIS_PASSWORD:}
    timeout: 3000
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  aop:
    auto: true

# MyBatis 설정
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 로깅 설정
logging:
  level:
    root: INFO
    com.vs.meta: INFO
    jdbc: OFF
    jdbc.sqltiming: OFF
    jdbc.sqlonly: OFF
    jdbc.audit: OFF
    jdbc.resultset: OFF
    jdbc.connection: OFF
    jdbc.resultsettable: OFF
    com.zaxxer.hikari: OFF
  pattern:
    console: "[%date{yyyy-MM-dd HH:mm:ss.SSS}] [%thread] [%level] [%c{0}:%L] : %msg %n"
    file: "[%date{yyyy-MM-dd HH:mm:ss.SSS}] [%thread] [%level] [%c{0}:%L] : %msg %n"

# NCP Cloud Outbound Mailer
ncp:
  mail:
    url: ${NCP_MAIL_URL:https://mail.apigw.ntruss.com}
    access-key: ${NCP_MAIL_ACCESS_KEY}
    secret-key: ${NCP_MAIL_SECRET_KEY}
    sender: ${NCP_MAIL_SENDER:noreply@vsaidt.com}

# 프론트엔드 URL (초대 메일 링크 등에 사용)
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# 로그인 Rate Limiting
login:
  rate-limit:
    max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    block-minutes: ${LOGIN_RATE_LIMIT_BLOCK_MINUTES:5}

# ===== SuperPlatform Auth (SSO) =====
spring.security.oauth2.resourceserver.jwt:
  jwk-set-uri: ${SP_AUTH_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
  issuer-uri: ${SP_AUTH_ISSUER:superplatform}

superplatform:
  auth:
    server-url: ${SP_AUTH_SERVER_URL:http://localhost:8080}
    client-id: ${SP_AUTH_CLIENT_ID:test-service}
    client-secret: ${SP_AUTH_CLIENT_SECRET}

key:
  salt:
    main: ${KEY_SALT_MAIN:}

# ===== 알림 기능 Phase 2 토글 =====
# pubsub.enabled : Redis Pub/Sub 사용 여부 (다중 인스턴스 환경)
#                  false → InMemoryDispatcher 사용 (Phase 1 동일)
#                  true  → RedisPubSubDispatcher 사용
# shedlock.enabled : 스케줄러 분산 락 사용 여부 (다중 인스턴스 환경)
#                    false → 일반 @Scheduled 동작 (단일 인스턴스 가정)
#                    true  → @SchedulerLock 활성화, MySQL `shedlock` 테이블 필요
# 로컬 검증용 기본값은 true. dev/stage 등은 환경변수로 false 설정.
notification:
  pubsub:
    enabled: ${NOTIFICATION_PUBSUB_ENABLED:true}
  shedlock:
    enabled: ${NOTIFICATION_SHEDLOCK_ENABLED:true}

# File Storage (NAS)
cloud:
  aws:
    nas:
      path: ${CLOUD_AWS_NAS_PATH:/files/nas}
