<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 목록 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='schools')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>학교 목록</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">학교 검색 <small class="text-muted" th:text="'(총 ' + ${total} + '개)'"></small></h3>
                    </div>
                    <div class="card-body">
                        <!-- 검색 필터 -->
                        <form th:action="@{/admin/schools}" method="get" class="filter-bar">
                            <div class="form-group">
                                <label class="small">검색어</label>
                                <input name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="학교명/학교코드" />
                            </div>
                            <div class="form-group">
                                <label class="small">학교급</label>
                                <select name="schoolLevel" class="form-control form-control-sm">
                                    <option value="">전체</option>
                                    <option value="elementary" th:selected="${schoolLevel == 'elementary'}">초등학교</option>
                                    <option value="middle" th:selected="${schoolLevel == 'middle'}">중학교</option>
                                    <option value="high" th:selected="${schoolLevel == 'high'}">고등학교</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="small">지역</label>
                                <input name="region" th:value="${region}" class="form-control form-control-sm" placeholder="시/도" />
                            </div>
                            <div class="form-group">
                                <label class="small">&nbsp;</label>
                                <div>
                                    <button type="submit" class="btn btn-primary btn-sm">검색</button>
                                    <a href="/admin/schools" class="btn btn-default btn-sm">초기화</a>
                                </div>
                            </div>
                        </form>

                        <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead class="thead-light">
                                <tr>
                                    <th style="width:50px;text-align:center;">NO</th>
                                    <th>학교명</th>
                                    <th>학교코드</th>
                                    <th>학교급</th>
                                    <th>지역</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="school, stat : ${schools}">
                                    <td class="text-center" th:text="${total - ((page - 1) * 20) - stat.index}"></td>
                                    <td th:text="${school.schoolName}"></td>
                                    <td class="text-muted code-cell" th:text="${school.schoolCode}"></td>
                                    <td>
                                        <span class="badge badge-info"
                                              th:text="${school.schoolLevel == 'elementary' ? '초등학교' : (school.schoolLevel == 'middle' ? '중학교' : (school.schoolLevel == 'high' ? '고등학교' : (school.schoolLevel ?: '-')))}"></span>
                                    </td>
                                    <td th:text="${(school.region ?: '') + (school.district != null ? ' ' + school.district : '')}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(schools)}">
                                    <td colspan="5" class="text-center text-muted py-4">검색 결과가 없습니다</td>
                                </tr>
                            </tbody>
                        </table>
                        </div>

                        <!-- 페이징 -->
                        <th:block th:replace="admin/fragments :: pagination('/admin/schools', ${(keyword != null ? '&amp;keyword=' + keyword : '') + (schoolLevel != null ? '&amp;schoolLevel=' + schoolLevel : '') + (region != null ? '&amp;region=' + region : '')})" />
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
</body>
</html>
