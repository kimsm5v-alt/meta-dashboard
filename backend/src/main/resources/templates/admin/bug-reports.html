<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버그리포트 관리 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='bug-reports')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>AI 버그리포트 관리</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${error}"></span>
                </div>

                <!-- 버그리포트 목록 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">버그리포트 목록 <small class="text-muted" th:text="'(총 ' + ${total} + '건)'"></small></h3>
                    </div>
                    <div class="card-body">
                        <!-- 검색 필터 -->
                        <form th:action="@{/admin/bug-reports}" method="get" class="filter-bar">
                            <div class="form-group">
                                <label class="small">상태</label>
                                <select name="status" class="form-control form-control-sm">
                                    <option value="">전체</option>
                                    <option value="pending" th:selected="${status == 'pending'}">대기중</option>
                                    <option value="reviewing" th:selected="${status == 'reviewing'}">검토중</option>
                                    <option value="resolved" th:selected="${status == 'resolved'}">해결됨</option>
                                    <option value="dismissed" th:selected="${status == 'dismissed'}">반려</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="small">오류 유형</label>
                                <select name="errorType" class="form-control form-control-sm">
                                    <option value="">전체</option>
                                    <option value="hallucination" th:selected="${errorType == 'hallucination'}">환각</option>
                                    <option value="data_mismatch" th:selected="${errorType == 'data_mismatch'}">데이터 불일치</option>
                                    <option value="missing_info" th:selected="${errorType == 'missing_info'}">정보 누락</option>
                                    <option value="sensitive" th:selected="${errorType == 'sensitive'}">민감 정보</option>
                                    <option value="ui_bug" th:selected="${errorType == 'ui_bug'}">UI 버그</option>
                                    <option value="other" th:selected="${errorType == 'other'}">기타</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="small">심각도</label>
                                <select name="severity" class="form-control form-control-sm">
                                    <option value="">전체</option>
                                    <option value="critical" th:selected="${severity == 'critical'}">심각</option>
                                    <option value="high" th:selected="${severity == 'high'}">높음</option>
                                    <option value="medium" th:selected="${severity == 'medium'}">보통</option>
                                    <option value="low" th:selected="${severity == 'low'}">낮음</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="small">&nbsp;</label>
                                <div>
                                    <button type="submit" class="btn btn-primary btn-sm">검색</button>
                                    <a href="/admin/bug-reports" class="btn btn-default btn-sm">초기화</a>
                                </div>
                            </div>
                        </form>

                        <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead class="thead-light">
                                <tr>
                                    <th>ID</th>
                                    <th>대화</th>
                                    <th>오류 유형</th>
                                    <th>심각도</th>
                                    <th>상태</th>
                                    <th>신고자</th>
                                    <th>신고일시</th>
                                    <th>상세</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="report : ${reports}">
                                    <td th:text="${report.id}"></td>
                                    <td>
                                        <span class="text-muted small" th:text="${report.conversationTitle != null ? report.conversationTitle : ('대화 #' + report.conversationId)}"></span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${report.errorType == 'hallucination'} ? 'badge-danger' :
                                                              (${report.errorType == 'data_mismatch'} ? 'badge-warning' :
                                                              (${report.errorType == 'missing_info'} ? 'badge-info' :
                                                              (${report.errorType == 'sensitive'} ? 'badge-purple' :
                                                              (${report.errorType == 'ui_bug'} ? 'badge-secondary' : 'badge-secondary'))))"
                                              th:text="${report.errorType}"></span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${report.severity == 'critical'} ? 'badge-danger' :
                                                              (${report.severity == 'high'} ? 'badge-warning' :
                                                              (${report.severity == 'medium'} ? 'badge-info' : 'badge-secondary'))"
                                              th:text="${report.severity}"></span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${report.status == 'pending'} ? 'badge-warning' :
                                                              (${report.status == 'reviewing'} ? 'badge-info' :
                                                              (${report.status == 'resolved'} ? 'badge-success' : 'badge-secondary'))"
                                              th:text="${report.status}"></span>
                                    </td>
                                    <td class="text-muted small" th:text="${report.reportedBy}"></td>
                                    <td class="text-muted small" th:text="${report.reportedAt != null} ? ${#temporals.format(report.reportedAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                                    <td>
                                        <a th:href="@{/admin/bug-reports/{id}(id=${report.id})}"
                                           class="btn btn-outline-info btn-xs">
                                            <i class="fas fa-eye mr-1"></i>상세
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(reports)}">
                                    <td colspan="8" class="text-center text-muted py-4">검색 결과가 없습니다</td>
                                </tr>
                            </tbody>
                        </table>
                        </div>

                        <!-- 페이징 -->
                        <th:block th:replace="admin/fragments :: pagination('/admin/bug-reports', ${(status != null ? '&amp;status=' + status : '') + (errorType != null ? '&amp;errorType=' + errorType : '') + (severity != null ? '&amp;severity=' + severity : '')})" />
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
</body>
</html>
