<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
    <style>
        .pw-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .pw-card { width:100%; max-width:420px; }
        .pw-card .card-header { font-weight:600; }
    </style>
</head>
<body class="hold-transition">
<div class="pw-wrap">
    <div class="pw-card">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-key mr-1"></i> 비밀번호 변경</span>
                <span class="text-muted" style="font-size:.8rem" th:text="${#authentication.name}"></span>
            </div>
            <div class="card-body">
                <div th:if="${mustChange}" class="alert alert-warning py-2" style="font-size:.85rem">
                    최초 로그인(또는 비밀번호 초기화) 상태입니다. 계속하려면 <b>비밀번호를 변경</b>해 주세요.
                </div>
                <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
                <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

                <form method="post" action="/admin/account/password">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="form-group">
                        <label>현재 비밀번호</label>
                        <input type="password" name="currentPassword" class="form-control" required autofocus/>
                    </div>
                    <div class="form-group">
                        <label>새 비밀번호 <small class="text-muted">(8자 이상)</small></label>
                        <input type="password" name="newPassword" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label>새 비밀번호 확인</label>
                        <input type="password" name="confirmPassword" class="form-control" required/>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">변경</button>
                </form>
            </div>
            <div class="card-footer text-right">
                <form th:action="@{/admin/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-link btn-sm text-muted"><i class="fas fa-sign-out-alt"></i> 로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
</body>
</html>
