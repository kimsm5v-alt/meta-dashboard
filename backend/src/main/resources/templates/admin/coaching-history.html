<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코칭 변경 이력 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
    <style>
        .snap { font-size:.82rem; color:#334155; white-space:pre-wrap; word-break:break-word; line-height:1.45; }
        .snap-label { font-size:.68rem; color:#94a3b8; font-weight:700; }
        .cur-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; }
    </style>
</head>
<body class="hold-transition sidebar-mini"
      th:with="menuName=${type == 'strength' ? 'coaching-strength' : 'coaching-moderation'},
               listUrl=${type == 'strength' ? '/admin/coaching/strength' : '/admin/coaching/moderation'},
               rollbackBase=${type == 'strength' ? '/admin/coaching/strength/history/' : '/admin/coaching/moderation/history/'}">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu=${menuName})"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid d-flex align-items-center" style="gap:12px;">
                <a th:href="${listUrl}" class="btn btn-default btn-sm"><i class="fas fa-arrow-left"></i> 목록</a>
                <h1 class="mb-0" th:text="${type == 'strength' ? '강점 코칭 변경 이력' : '보완점 코칭 변경 이력'}"></h1>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- 현재 값 -->
                <div class="card card-primary card-outline">
                    <div class="card-header"><h3 class="card-title">현재 값
                        <small class="text-muted" th:if="${type == 'strength'}"
                               th:text="'· ' + (${item.schoolLevel} == 'elementary' ? '초등' : '중등') + ' · ' + ${item.lpaClass} + ' · ' + ${item.factor}"></small>
                        <small class="text-muted" th:if="${type == 'moderation'}"
                               th:text="'· ' + (${item.schoolLevel} == 'elementary' ? '초등' : '중등') + ' · ' + ${item.lpaClass} + ' · Z:' + ${item.zFactor}"></small>
                    </h3></div>
                    <div class="card-body cur-box">
                        <th:block th:if="${type == 'strength'}">
                            <div class="snap-label">관찰</div><div class="snap mb-2" th:text="${item.observation}"></div>
                            <div class="snap-label">멘트</div><div class="snap mb-2" th:text="${item.line}"></div>
                            <div class="snap-label">질문</div><div class="snap" th:text="${item.question}"></div>
                        </th:block>
                        <th:block th:if="${type == 'moderation'}">
                            <div class="snap-label">해석</div><div class="snap mb-2" th:text="${item.interpretation}"></div>
                            <div class="snap-label">코칭1 방법</div><div class="snap mb-2" th:text="${item.coaching1Method}"></div>
                            <div class="snap-label">코칭1 멘트</div><div class="snap mb-2" th:text="${item.coaching1Line}"></div>
                            <div class="snap-label">코칭2 행동</div><div class="snap mb-2" th:text="${item.coaching2Action}"></div>
                            <div class="snap-label">코칭2 멘트</div><div class="snap" th:text="${item.coaching2Line}"></div>
                        </th:block>
                    </div>
                </div>

                <!-- 이력 (변경 직전 스냅샷) -->
                <div class="card">
                    <div class="card-header"><h3 class="card-title">변경 이력 <small class="text-muted">최신순 · 각 항목은 변경 직전 값</small></h3></div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <thead class="thead-light"><tr>
                                <th style="width:150px;">변경 시각</th><th style="width:90px;">구분</th><th>스냅샷</th><th style="width:120px;" class="text-right">되돌리기</th>
                            </tr></thead>
                            <tbody>
                                <tr th:each="h : ${history}">
                                    <td class="text-muted" th:text="${h.changedAt}"></td>
                                    <td><span class="badge" th:classappend="${h.action == 'ROLLBACK'} ? 'badge-warning' : 'badge-secondary'" th:text="${h.action}"></span></td>
                                    <td>
                                        <th:block th:if="${type == 'strength'}">
                                            <div class="snap-label">관찰</div><div class="snap mb-1" th:text="${h.observation}"></div>
                                            <div class="snap-label">멘트</div><div class="snap mb-1" th:text="${h.line}"></div>
                                            <div class="snap-label">질문</div><div class="snap" th:text="${h.question}"></div>
                                        </th:block>
                                        <th:block th:if="${type == 'moderation'}">
                                            <div class="snap-label">해석</div><div class="snap mb-1" th:text="${h.interpretation}"></div>
                                            <div class="snap-label">코칭1</div><div class="snap mb-1" th:text="${h.coaching1Method} + ' / ' + ${h.coaching1Line}"></div>
                                            <div class="snap-label">코칭2</div><div class="snap" th:text="${h.coaching2Action} + ' / ' + ${h.coaching2Line}"></div>
                                        </th:block>
                                    </td>
                                    <td class="text-right">
                                        <form method="post" th:action="${rollbackBase} + ${h.historyId} + '/rollback'"
                                              onsubmit="return confirm('이 시점의 값으로 되돌릴까요? (현재 값도 이력에 남습니다)');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-sm btn-warning"><i class="fas fa-undo"></i> 되돌리기</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(history)}"><td colspan="4" class="text-muted text-center py-3">변경 이력이 없습니다.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
</body>
</html>
