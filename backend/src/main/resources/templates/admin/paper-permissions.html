<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>검사 권한 관리 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
    <style>
        .perm-cell { text-align:center; white-space:nowrap; }
        .perm-check { transform: scale(1.25); cursor: pointer; }
        .perm-label { font-size:.78rem; color:#475569; margin-left:4px; vertical-align:middle; }
        .email-cell { color:#475569; font-size:.85rem; }
        .row-saving { opacity:.5; }
        .save-flash { font-size:.72rem; margin-left:6px; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='paper-permissions')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>검사 권한 관리</h1>
                <p class="text-muted">
                    교사 계정별 검사 유형(paperIdx) 허용 여부 · 체크 시 <b>즉시 저장</b>
                    (권한 행 없으면 기본 종합학습검사만 허용)
                </p>
                <p class="text-muted" style="font-size:.82rem" th:if="${!searchMode}">
                    가입 최신순(idx DESC) · 총 <b th:text="${total}"></b>명
                </p>
                <p class="text-info" style="font-size:.82rem" th:if="${searchMode}">
                    <i class="fas fa-search"></i> 검색 결과 — 이름·이메일·닉네임 부분일치, <b>가입 최신순</b> 정렬
                    (권한 대상 교사만 표시)
                </p>
                <p class="text-muted" style="font-size:.76rem">
                    개인정보 표기:
                    <span class="badge badge-warning">미동의</span> 개인정보 제공 미동의(계정 존재) ·
                    <span class="badge badge-secondary">탈퇴중</span> 탈퇴 grace 진행 ·
                    <span class="badge badge-danger">조회불가</span> Auth 미조회/일시 오류
                </p>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <!-- 검색 (이름/이메일 통합) -->
                <div class="card">
                    <div class="card-body">
                        <form method="get" action="/admin/paper-permissions" class="filter-bar">
                            <div class="form-group">
                                <label>검색</label>
                                <input type="text" name="keyword" class="form-control form-control-sm"
                                       style="min-width:260px" th:value="${keyword}"
                                       placeholder="이름 또는 이메일"/>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary btn-sm">검색</button>
                                <a href="/admin/paper-permissions" class="btn btn-default btn-sm">초기화</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 목록 -->
                <div class="card">
                    <div class="card-body table-responsive p-0">
                        <table class="table table-hover mb-0">
                            <thead class="thead-light"><tr>
                                <th>이름</th>
                                <th>이메일</th>
                                <th>가입일</th>
                                <th class="text-center">종합학습검사<br><small class="text-muted">paperIdx=1</small></th>
                                <th class="text-center">자기조절<br><small class="text-muted">paperIdx=2</small></th>
                            </tr></thead>
                            <tbody>
                                <tr th:each="r : ${rows}" th:attr="data-user-no=${r.userNo}">
                                    <td>
                                        <b th:if="${r.piiAvailable}" th:text="${r.name}"></b>
                                        <span th:unless="${r.piiAvailable}" class="text-muted">이름 비공개</span>
                                        <span th:unless="${r.piiAvailable}" class="badge" style="font-size:.66rem; cursor:help"
                                              th:classappend="${r.reasonBadge}"
                                              data-toggle="tooltip" data-placement="top"
                                              th:title="${r.reasonTip}"
                                              th:text="${r.reasonLabel}"></span>
                                    </td>
                                    <td class="email-cell" th:text="${r.email != null} ? ${r.email} : '-'"></td>
                                    <td class="text-muted" th:text="${r.createdAt}"></td>
                                    <td class="perm-cell">
                                        <input type="checkbox" class="perm-check" data-type="comprehensive"
                                               th:checked="${r.comprehensiveYn == 'Y'}"/>
                                        <span class="save-flash"></span>
                                    </td>
                                    <td class="perm-cell">
                                        <input type="checkbox" class="perm-check" data-type="selfreg"
                                               th:checked="${r.selfregYn == 'Y'}"/>
                                        <span class="save-flash"></span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="text-muted text-center py-3">데이터 없음</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer">
                        <div th:replace="admin/fragments :: pagination('/admin/paper-permissions', ${params})"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
<script>
    // Bootstrap 툴팁 초기화 (AdminLTE 번들 jQuery + Bootstrap)
    $(function () { $('[data-toggle="tooltip"]').tooltip(); });

    (function () {
        var csrfToken  = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        function flash(el, ok) {
            el.textContent = ok ? '저장됨' : '실패';
            el.style.color = ok ? '#16a34a' : '#dc2626';
            setTimeout(function () { el.textContent = ''; }, 1500);
        }

        document.querySelectorAll('tr[data-user-no]').forEach(function (row) {
            var userNo = row.getAttribute('data-user-no');
            var comp   = row.querySelector('input[data-type="comprehensive"]');
            var self   = row.querySelector('input[data-type="selfreg"]');

            row.querySelectorAll('.perm-check').forEach(function (chk) {
                chk.addEventListener('change', function () {
                    var flashEl = chk.parentElement.querySelector('.save-flash');
                    // 변경 직전 상태 백업 (실패 시 롤백)
                    var prevComp = comp.checked, prevSelf = self.checked;
                    if (chk === comp) { prevComp = !comp.checked; } else { prevSelf = !self.checked; }

                    row.classList.add('row-saving');
                    var body = 'comprehensive=' + comp.checked + '&selfreg=' + self.checked;
                    var headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                    headers[csrfHeader] = csrfToken;

                    fetch('/admin/paper-permissions/' + userNo, {
                        method: 'POST', headers: headers, body: body
                    })
                    .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
                    .then(function (data) {
                        if (!data.success) { throw new Error(data.message || '저장 실패'); }
                        flash(flashEl, true);
                    })
                    .catch(function (err) {
                        console.error('권한 저장 실패', err);
                        comp.checked = prevComp; self.checked = prevSelf; // 롤백
                        flash(flashEl, false);
                    })
                    .finally(function () { row.classList.remove('row-saving'); });
                });
            });
        });
    })();
</script>
</body>
</html>
