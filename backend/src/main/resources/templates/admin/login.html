<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(59,130,246,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(139,92,246,0.06) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite alternate;
        }
        @keyframes drift {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-40px, -20px); }
        }

        .login-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 48px 40px 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .login-logo .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(59,130,246,0.3);
        }
        .login-logo .icon-circle i {
            font-size: 28px;
            color: #fff;
        }
        .login-logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: -0.3px;
        }
        .login-logo h1 span { color: #60a5fa; }
        .login-logo p {
            font-size: 13px;
            color: #64748b;
            margin-top: 6px;
            font-weight: 400;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-danger {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
        }
        .alert-info {
            background: rgba(59,130,246,0.12);
            border: 1px solid rgba(59,130,246,0.2);
            color: #93c5fd;
        }
        .alert i { font-size: 15px; flex-shrink: 0; }
        .alert .close-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: inherit;
            opacity: 0.5;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            line-height: 1;
        }
        .alert .close-btn:hover { opacity: 1; }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 14px;
            transition: color 0.2s;
        }
        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
        }
        .input-wrap input::placeholder { color: #475569; }
        .input-wrap input:focus {
            border-color: rgba(59,130,246,0.5);
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .input-wrap input:focus + i,
        .input-wrap:focus-within i { color: #60a5fa; }

        .btn-login {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(59,130,246,0.3);
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(59,130,246,0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <div class="icon-circle"><i class="fas fa-shield-alt"></i></div>
                <h1><span>Meta</span> Admin</h1>
                <p>관리자 콘솔에 로그인하세요</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i>
                <span>이메일 또는 비밀번호가 올바르지 않습니다.</span>
                <button type="button" class="close-btn" onclick="this.parentElement.remove()">&times;</button>
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                <i class="fas fa-check-circle"></i>
                <span>로그아웃 되었습니다.</span>
                <button type="button" class="close-btn" onclick="this.parentElement.remove()">&times;</button>
            </div>

            <form th:action="@{/admin/login}" method="post">
                <div class="form-group">
                    <label>이메일</label>
                    <div class="input-wrap">
                        <input type="email" name="email" placeholder="관리자 이메일을 입력하세요" required autofocus />
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <div class="input-wrap">
                        <input type="password" name="password" placeholder="비밀번호를 입력하세요" required />
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login">로그인</button>
            </form>

            <div class="login-footer">Meta &copy; 2026</div>
        </div>
    </div>
</body>
</html>
