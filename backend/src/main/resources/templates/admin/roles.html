<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>권한 관리 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='roles')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>권한 관리</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${error}"></span>
                </div>

                <!-- 역할 등록/수정 -->
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <h3 class="card-title">역할 등록 / 수정</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/roles/upsert}" method="post">
                            <div class="row">
                                <div class="col-md-3 form-group">
                                    <label>역할 코드</label>
                                    <input name="roleCode" class="form-control form-control-sm" required placeholder="ADMIN" />
                                </div>
                                <div class="col-md-3 form-group">
                                    <label>역할명</label>
                                    <input name="roleName" class="form-control form-control-sm" required placeholder="관리자" />
                                </div>
                                <div class="col-md-2 form-group">
                                    <label>레벨</label>
                                    <input name="level" type="number" class="form-control form-control-sm" required value="1" />
                                </div>
                                <div class="col-md-3 form-group">
                                    <label>설명</label>
                                    <input name="description" class="form-control form-control-sm" placeholder="선택사항" />
                                </div>
                                <div class="col-md-1 form-group d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary btn-sm">저장</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 역할 목록 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">역할 목록 <small class="text-muted" th:text="'(총 ' + ${total} + '개)'"></small></h3>
                    </div>
                    <div class="card-body table-responsive p-0">
                        <table class="table table-hover table-sm">
                            <thead class="thead-light">
                                <tr>
                                    <th>역할 코드</th>
                                    <th>역할명</th>
                                    <th>레벨</th>
                                    <th>설명</th>
                                    <th>등록일</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="role : ${roles}">
                                    <td><span class="badge badge-purple" th:text="${role.roleCode}"></span></td>
                                    <td th:text="${role.roleName}"></td>
                                    <td th:text="${role.level}"></td>
                                    <td class="text-muted" th:text="${role.description ?: '-'}"></td>
                                    <td class="text-muted" th:text="${role.createdAt != null} ? ${#temporals.format(role.createdAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer clearfix">
                        <th:block th:replace="admin/fragments :: pagination('/admin/roles', '')" />
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
</body>
</html>
