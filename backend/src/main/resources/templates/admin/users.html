<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>사용자 관리 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='users')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>사용자 관리</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${error}"></span>
                </div>

                <!-- 계정 등록 -->
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <h3 class="card-title">계정 등록</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/users/create}" method="post">
                            <div class="row">
                                <div class="col-md-4 form-group">
                                    <label>이메일</label>
                                    <input name="email" type="email" class="form-control form-control-sm" required placeholder="user@example.com" />
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>비밀번호</label>
                                    <input name="password" type="password" class="form-control form-control-sm" required />
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>닉네임</label>
                                    <input name="nickname" class="form-control form-control-sm" required />
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 form-group">
                                    <label>성별</label>
                                    <select name="gender" class="form-control form-control-sm" required>
                                        <option value="">선택</option>
                                        <option value="M">남</option>
                                        <option value="F">여</option>
                                    </select>
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>역할</label>
                                    <select name="roleCode" class="form-control form-control-sm">
                                        <option th:each="role : ${roles}" th:value="${role.roleCode}"
                                                th:text="${role.roleName + ' (' + role.roleCode + ')'}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4 form-group d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary btn-sm">등록</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 사용자 목록 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">사용자 목록 <small class="text-muted" th:text="'(총 ' + ${total} + '명)'"></small></h3>
                    </div>
                    <div class="card-body">
                        <!-- 검색 필터 -->
                        <form th:action="@{/admin/users}" method="get" class="filter-bar">
                            <div class="form-group">
                                <label class="small">검색어</label>
                                <input name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="이메일/닉네임" />
                            </div>
                            <div class="form-group">
                                <label class="small">역할</label>
                                <select name="roleCode" class="form-control form-control-sm">
                                    <option value="">전체</option>
                                    <option th:each="role : ${roles}" th:value="${role.roleCode}"
                                            th:text="|${role.roleName} (${role.roleCode})|"
                                            th:selected="${role.roleCode == roleCode}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="small">상태</label>
                                <select name="status" class="form-control form-control-sm">
                                    <option value="">전체</option>
                                    <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">활성</option>
                                    <option value="WITHDRAWN" th:selected="${status == 'WITHDRAWN'}">탈퇴</option>
                                    <option value="SUSPENDED" th:selected="${status == 'SUSPENDED'}">정지</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="small">&nbsp;</label>
                                <div>
                                    <button type="submit" class="btn btn-primary btn-sm">검색</button>
                                    <a href="/admin/users" class="btn btn-default btn-sm">초기화</a>
                                </div>
                            </div>
                        </form>

                        <div class="table-responsive">
                        <table class="table table-hover table-sm">
                            <thead class="thead-light">
                                <tr>
                                    <th>USER_NO</th>
                                    <th>이메일</th>
                                    <th>닉네임</th>
                                    <th>성별</th>
                                    <th>역할</th>
                                    <th>상태</th>
                                    <th>마지막 로그인</th>
                                    <th>역할 변경</th>
                                    <th>상태 변경</th>
                                    <th>학교 매핑</th>
                                    <th>비밀번호</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.userNo}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td th:text="${user.nickname}"></td>
                                    <td><span th:text="${user.gender == 'M' ? '남' : (user.gender == 'F' ? '여' : '-')}"></span></td>
                                    <td><span class="badge badge-info" th:text="${user.roleCode}"></span></td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${user.status?.name() == 'ACTIVE'} ? 'badge-success' : (${user.status?.name() == 'SUSPENDED'} ? 'badge-danger' : 'badge-secondary')"
                                              th:text="${user.status}"></span>
                                    </td>
                                    <td class="text-muted" th:text="${user.lastLoginAt != null} ? ${#temporals.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                                    <td>
                                        <form th:action="@{/admin/users/role}" method="post" class="inline-form">
                                            <input type="hidden" name="userNo" th:value="${user.userNo}" />
                                            <select name="roleCode" class="form-control form-control-sm" style="width:auto;display:inline-block;">
                                                <option th:each="role : ${roles}" th:value="${role.roleCode}"
                                                        th:text="${role.roleCode}"
                                                        th:selected="${role.roleCode == user.roleCode}"></option>
                                            </select>
                                            <button type="submit" class="btn btn-primary btn-xs">변경</button>
                                        </form>
                                    </td>
                                    <td>
                                        <form th:action="@{/admin/users/status}" method="post" class="inline-form">
                                            <input type="hidden" name="userNo" th:value="${user.userNo}" />
                                            <select name="status" class="form-control form-control-sm" style="width:auto;display:inline-block;">
                                                <option value="ACTIVE" th:selected="${user.status?.name() == 'ACTIVE'}">활성</option>
                                                <option value="WITHDRAWN" th:selected="${user.status?.name() == 'WITHDRAWN'}">탈퇴</option>
                                                <option value="SUSPENDED" th:selected="${user.status?.name() == 'SUSPENDED'}">정지</option>
                                            </select>
                                            <button type="submit" class="btn btn-danger btn-xs">변경</button>
                                        </form>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/school-map(userNo=${user.userNo})}"
                                           class="btn btn-outline-info btn-xs">
                                            <i class="fas fa-school mr-1"></i>매핑
                                        </a>
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-outline-warning btn-xs"
                                                th:data-user-no="${user.userNo}"
                                                th:data-email="${user.email}"
                                                th:data-nickname="${user.nickname}"
                                                onclick="confirmResetPassword(this)">
                                            <i class="fas fa-key mr-1"></i>비밀번호 초기화
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="11" class="text-center text-muted py-4">검색 결과가 없습니다</td>
                                </tr>
                            </tbody>
                        </table>
                        </div>

                        <!-- 페이징 -->
                        <th:block th:replace="admin/fragments :: pagination('/admin/users', ${(keyword != null ? '&amp;keyword=' + keyword : '') + (roleCode != null ? '&amp;roleCode=' + roleCode : '') + (status != null ? '&amp;status=' + status : '')})" />
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<!-- 비밀번호 초기화 결과 모달 -->
<div class="modal fade" id="resetPasswordModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title">비밀번호 초기화 완료</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body text-center">
                <p class="mb-2">임시 비밀번호</p>
                <h3 id="tempPasswordDisplay" class="text-primary" style="letter-spacing:2px;user-select:all"></h3>
                <button type="button" class="btn btn-outline-secondary btn-sm mt-2" onclick="copyTempPassword()">
                    <i class="fas fa-copy mr-1"></i>복사
                </button>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-info btn-sm" id="sendEmailBtn" onclick="sendTempPasswordEmail()">
                    <i class="fas fa-envelope mr-1"></i>이메일로 발송
                </button>
                <button type="button" class="btn btn-default btn-sm" data-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="admin/fragments :: js" />
<script>
var _csrfToken = $('meta[name="_csrf"]').attr('content');
var _csrfHeader = $('meta[name="_csrf_header"]').attr('content');
$.ajaxSetup({ beforeSend: function(xhr) { xhr.setRequestHeader(_csrfHeader, _csrfToken); } });

var _resetUserNo = null;
var _tempPassword = null;

function confirmResetPassword(btn) {
    var userNo = btn.getAttribute('data-user-no');
    var email = btn.getAttribute('data-email');
    var nickname = btn.getAttribute('data-nickname');
    if (!confirm(nickname + '(' + email + ') 비밀번호를 초기화하시겠습니까?')) return;

    _resetUserNo = userNo;
    $.post('/admin/users/reset-password', { userNo: userNo }, function(res) {
        if (res.success) {
            _tempPassword = res.tempPassword;
            $('#tempPasswordDisplay').text(res.tempPassword);
            $('#sendEmailBtn').prop('disabled', false)
                .removeClass('btn-success').addClass('btn-info')
                .html('<i class="fas fa-envelope mr-1"></i>이메일로 발송');
            $('#resetPasswordModal').modal('show');
        } else {
            alert('실패: ' + res.message);
        }
    }).fail(function() {
        alert('서버 오류가 발생했습니다.');
    });
}

function copyTempPassword() {
    if (!_tempPassword) return;
    navigator.clipboard.writeText(_tempPassword).then(function() {
        alert('복사되었습니다.');
    });
}

function sendTempPasswordEmail() {
    if (!_resetUserNo || !_tempPassword) return;
    var btn = $('#sendEmailBtn');
    btn.prop('disabled', true).text('발송 중...');

    $.post('/admin/users/send-temp-password', {
        userNo: _resetUserNo,
        tempPassword: _tempPassword
    }, function(res) {
        if (res.success) {
            btn.text('발송 완료').removeClass('btn-info').addClass('btn-success');
        } else {
            alert('발송 실패: ' + res.message);
            btn.prop('disabled', false).html('<i class="fas fa-envelope mr-1"></i>이메일로 발송');
        }
    }).fail(function() {
        alert('서버 오류가 발생했습니다.');
        btn.prop('disabled', false).html('<i class="fas fa-envelope mr-1"></i>이메일로 발송');
    });
}
</script>
</body>
</html>
