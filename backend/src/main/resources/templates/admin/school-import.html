<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 등록 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='school-import')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>학교 등록</h1>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${error}"></span>
                </div>

                <!-- CSV 업로드 -->
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fas fa-file-upload mr-1"></i> CSV / TSV 파일 업로드</h3>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small mb-3">학교 데이터 파일을 업로드합니다. UTF-8, MS949 인코딩 지원. CSV/TSV 자동 감지.</p>
                        <form th:action="@{/admin/school-import/upload}" method="post" enctype="multipart/form-data">
                            <div class="row">
                                <div class="col-md-8 form-group">
                                    <div class="custom-file">
                                        <input type="file" name="file" class="custom-file-input" id="csvFile" accept=".csv,.tsv,.txt" required />
                                        <label class="custom-file-label" for="csvFile">파일 선택...</label>
                                    </div>
                                </div>
                                <div class="col-md-4 form-group">
                                    <button type="submit" class="btn btn-primary"><i class="fas fa-upload mr-1"></i> 업로드</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Import errors -->
                <div th:if="${importErrors}" class="card card-danger card-outline">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fas fa-exclamation-triangle mr-1"></i> 업로드 오류 내역</h3>
                    </div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item text-danger small py-1" th:each="err : ${importErrors}" th:text="${err}"></li>
                        </ul>
                    </div>
                </div>

                <!-- 현황 -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">현황</h3>
                    </div>
                    <div class="card-body">
                        <p>DB 등록 학교 수: <strong th:text="${totalSchools}">0</strong> 건</p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
<script>
    // 파일명 표시
    document.getElementById('csvFile').addEventListener('change', function() {
        this.nextElementSibling.textContent = this.files[0] ? this.files[0].name : '파일 선택...';
    });
</script>
</body>
</html>
