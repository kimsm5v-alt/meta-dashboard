<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 관리 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
    <style>
        .role-badge { font-size:.72rem; }
        .inline-form { display:inline; }
        .col-actions { white-space:nowrap; }
        .muted-self { color:#94a3b8; font-size:.75rem; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='accounts')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <h1>계정 관리</h1>
                <p class="text-muted">
                    관리자 계정 생성·비밀번호 초기화·상태/권한 관리 · 총 <b th:text="${total}"></b>명 ·
                    임시비밀번호는 <b>{아이디}!12</b> 고정, 최초 로그인 시 변경 필요
                </p>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <!-- 검색 + 생성 -->
                <div class="card">
                    <div class="card-body d-flex justify-content-between align-items-end flex-wrap">
                        <form method="get" action="/admin/accounts" class="filter-bar">
                            <div class="form-group">
                                <label>검색</label>
                                <input type="text" name="keyword" class="form-control form-control-sm"
                                       style="min-width:240px" th:value="${keyword}" placeholder="아이디 또는 이름"/>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary btn-sm">검색</button>
                                <a href="/admin/accounts" class="btn btn-default btn-sm">초기화</a>
                            </div>
                        </form>
                        <button type="button" class="btn btn-success btn-sm" data-toggle="modal" data-target="#createModal">
                            <i class="fas fa-user-plus"></i> 계정 생성
                        </button>
                    </div>
                </div>

                <!-- 목록 -->
                <div class="card">
                    <div class="card-body table-responsive p-0">
                        <table class="table table-hover mb-0">
                            <thead class="thead-light"><tr>
                                <th>아이디</th><th>이름</th><th>권한</th><th>상태</th><th>최근 로그인</th>
                                <th class="text-right">관리</th>
                            </tr></thead>
                            <tbody>
                                <tr th:each="r : ${rows}">
                                    <td><b th:text="${r.email}"></b>
                                        <span th:if="${r.id == currentAdminId}" class="muted-self">(본인)</span>
                                    </td>
                                    <td th:text="${r.nickname}"></td>
                                    <td>
                                        <span class="badge role-badge"
                                              th:classappend="${r.role == 'SUPER_ADMIN'} ? 'badge-danger' : 'badge-secondary'"
                                              th:text="${r.role == 'SUPER_ADMIN'} ? '최고관리자' : '관리자'"></span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${r.status == 'ACTIVE'} ? 'badge-success' : 'badge-dark'"
                                              th:text="${r.status == 'ACTIVE'} ? '활성' : '정지'"></span>
                                    </td>
                                    <td class="text-muted" th:text="${r.lastLoginAt != null} ? ${#temporals.format(r.lastLoginAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                                    <td class="text-right col-actions">
                                        <!-- 비밀번호 초기화 -->
                                        <form class="inline-form" method="post" th:action="@{'/admin/accounts/' + ${r.id} + '/reset-password'}"
                                              onsubmit="return confirm('비밀번호를 초기화하시겠습니까? 임시비밀번호는 [아이디]!12 입니다.');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-sm btn-outline-warning"><i class="fas fa-key"></i> 비번초기화</button>
                                        </form>

                                        <!-- 권한 변경 (본인 제외) -->
                                        <form class="inline-form" method="post" th:action="@{'/admin/accounts/' + ${r.id} + '/role'}"
                                              th:if="${r.id != currentAdminId}">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <select name="role" class="form-control form-control-sm d-inline-block" style="width:auto"
                                                    onchange="this.form.submit()">
                                                <option value="ADMIN" th:selected="${r.role == 'ADMIN'}">관리자</option>
                                                <option value="SUPER_ADMIN" th:selected="${r.role == 'SUPER_ADMIN'}">최고관리자</option>
                                            </select>
                                        </form>

                                        <!-- 상태 토글 (본인 제외) -->
                                        <form class="inline-form" method="post" th:action="@{'/admin/accounts/' + ${r.id} + '/status'}"
                                              th:if="${r.id != currentAdminId}">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <input type="hidden" name="status" th:value="${r.status == 'ACTIVE'} ? 'SUSPENDED' : 'ACTIVE'"/>
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${r.status == 'ACTIVE'} ? 'btn-outline-dark' : 'btn-outline-success'"
                                                    th:text="${r.status == 'ACTIVE'} ? '정지' : '활성화'"></button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="text-muted text-center py-3">데이터 없음</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="card-footer">
                        <div th:replace="admin/fragments :: pagination('/admin/accounts', ${params})"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 계정 생성 모달 -->
    <div class="modal fade" id="createModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <form method="post" action="/admin/accounts">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">관리자 계정 생성</h4>
                        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>아이디 <small class="text-muted">(로그인 ID · 공백 불가)</small></label>
                            <input type="text" name="loginId" class="form-control" required/>
                        </div>
                        <div class="form-group">
                            <label>이름</label>
                            <input type="text" name="nickname" class="form-control" required/>
                        </div>
                        <div class="form-group">
                            <label>권한</label>
                            <select name="role" class="form-control">
                                <option value="ADMIN" selected>관리자</option>
                                <option value="SUPER_ADMIN">최고관리자</option>
                            </select>
                        </div>
                        <p class="text-muted mb-0" style="font-size:.82rem">
                            임시비밀번호는 <b>{아이디}!12</b>로 생성되며, 최초 로그인 시 변경해야 합니다.
                        </p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-success">생성</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
</body>
</html>
