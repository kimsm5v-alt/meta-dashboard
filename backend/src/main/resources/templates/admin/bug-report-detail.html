<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버그리포트 상세 - Meta Admin</title>
    <th:block th:replace="admin/fragments :: css" />
    <style>
        .screenshot-preview { max-width: 100%; max-height: 400px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .message-content { background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; white-space: pre-wrap; font-family: inherit; }
        .info-row { display: flex; margin-bottom: 12px; }
        .info-label { width: 120px; font-weight: 600; color: #64748b; flex-shrink: 0; }
        .info-value { flex: 1; color: #1e293b; }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <nav th:replace="admin/fragments :: navbar"></nav>
    <aside th:replace="admin/fragments :: sidebar(menu='bug-reports')"></aside>

    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <h1>버그리포트 상세 <small class="text-muted" th:text="'#' + ${report.id}"></small></h1>
                    <a href="/admin/bug-reports" class="btn btn-default btn-sm">
                        <i class="fas fa-arrow-left mr-1"></i>목록으로
                    </a>
                </div>
            </div>
        </section>
        <section class="content">
            <div class="container-fluid">
                <div th:if="${success}" class="alert alert-success alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible">
                    <button type="button" class="close" data-dismiss="alert">&times;</button>
                    <span th:text="${error}"></span>
                </div>

                <div class="row">
                    <!-- 왼쪽: 버그 정보 -->
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">버그 정보</h3>
                            </div>
                            <div class="card-body">
                                <div class="info-row">
                                    <span class="info-label">ID</span>
                                    <span class="info-value" th:text="${report.id}"></span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">대화 ID</span>
                                    <span class="info-value">
                                        <span th:text="${report.conversationId}"></span>
                                        <span class="text-muted ml-2" th:if="${report.conversationTitle}" th:text="'(' + ${report.conversationTitle} + ')'"></span>
                                    </span>
                                </div>
                                <div class="info-row" th:if="${report.messageId}">
                                    <span class="info-label">메시지 ID</span>
                                    <span class="info-value" th:text="${report.messageId}"></span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">오류 유형</span>
                                    <span class="info-value">
                                        <span class="badge"
                                              th:classappend="${report.errorType == 'hallucination'} ? 'badge-danger' :
                                                              (${report.errorType == 'data_mismatch'} ? 'badge-warning' :
                                                              (${report.errorType == 'missing_info'} ? 'badge-info' :
                                                              (${report.errorType == 'sensitive'} ? 'badge-purple' :
                                                              (${report.errorType == 'ui_bug'} ? 'badge-secondary' : 'badge-secondary'))))"
                                              th:text="${report.errorType}"></span>
                                    </span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">심각도</span>
                                    <span class="info-value">
                                        <span class="badge"
                                              th:classappend="${report.severity == 'critical'} ? 'badge-danger' :
                                                              (${report.severity == 'high'} ? 'badge-warning' :
                                                              (${report.severity == 'medium'} ? 'badge-info' : 'badge-secondary'))"
                                              th:text="${report.severity}"></span>
                                    </span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">현재 상태</span>
                                    <span class="info-value">
                                        <span class="badge"
                                              th:classappend="${report.status == 'pending'} ? 'badge-warning' :
                                                              (${report.status == 'reviewing'} ? 'badge-info' :
                                                              (${report.status == 'resolved'} ? 'badge-success' : 'badge-secondary'))"
                                              th:text="${report.status}"></span>
                                    </span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">신고자</span>
                                    <span class="info-value" th:text="${report.reportedBy}"></span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">신고일시</span>
                                    <span class="info-value" th:text="${report.reportedAt != null} ? ${#temporals.format(report.reportedAt, 'yyyy-MM-dd HH:mm:ss')} : '-'"></span>
                                </div>
                                <div class="info-row" th:if="${report.resolvedBy}">
                                    <span class="info-label">처리자</span>
                                    <span class="info-value" th:text="${report.resolvedBy}"></span>
                                </div>
                                <div class="info-row" th:if="${report.resolvedAt}">
                                    <span class="info-label">처리일시</span>
                                    <span class="info-value" th:text="${#temporals.format(report.resolvedAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
                                </div>

                                <hr class="my-4" />

                                <h6 class="text-muted mb-3">신고 내용</h6>
                                <div class="message-content" th:text="${report.description != null ? report.description : '(설명 없음)'}"></div>

                                <div th:if="${report.resolutionNote}" class="mt-4">
                                    <h6 class="text-muted mb-3">처리 메모</h6>
                                    <div class="message-content" th:text="${report.resolutionNote}"></div>
                                </div>

                                <!-- 문제 메시지 내용 -->
                                <div th:if="${report.messageContent}" class="mt-4">
                                    <h6 class="text-muted mb-3">문제 메시지</h6>
                                    <div class="message-content">
                                        <span class="badge badge-info mb-2" th:text="${report.messageRole}"></span>
                                        <div th:text="${report.messageContent}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 스크린샷 -->
                        <div class="card" th:if="${report.screenshotUrl}">
                            <div class="card-header">
                                <h3 class="card-title">스크린샷</h3>
                            </div>
                            <div class="card-body text-center">
                                <a th:href="${report.screenshotUrl}" target="_blank">
                                    <img th:src="${report.screenshotUrl}" alt="스크린샷" class="screenshot-preview" />
                                </a>
                                <div class="mt-2">
                                    <a th:href="${report.screenshotUrl}" target="_blank" class="btn btn-outline-info btn-sm">
                                        <i class="fas fa-external-link-alt mr-1"></i>원본 보기
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 오른쪽: 상태 변경 -->
                    <div class="col-md-4">
                        <div class="card card-primary card-outline">
                            <div class="card-header">
                                <h3 class="card-title">상태 변경</h3>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/admin/bug-reports/{id}/status(id=${report.id})}" method="post">
                                    <div class="form-group">
                                        <label>상태</label>
                                        <select name="status" class="form-control">
                                            <option value="pending" th:selected="${report.status == 'pending'}">대기중 (pending)</option>
                                            <option value="reviewing" th:selected="${report.status == 'reviewing'}">검토중 (reviewing)</option>
                                            <option value="resolved" th:selected="${report.status == 'resolved'}">해결됨 (resolved)</option>
                                            <option value="dismissed" th:selected="${report.status == 'dismissed'}">반려 (dismissed)</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>처리 메모</label>
                                        <textarea name="resolutionNote" class="form-control" rows="4" placeholder="처리 내용을 입력하세요..."
                                                  th:text="${report.resolutionNote}"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-block">
                                        <i class="fas fa-save mr-1"></i>저장
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- 대화 컨텍스트 정보 -->
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">대화 정보</h3>
                            </div>
                            <div class="card-body">
                                <div class="info-row">
                                    <span class="info-label">대화 제목</span>
                                    <span class="info-value" th:text="${report.conversationTitle != null ? report.conversationTitle : '-'}"></span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">모드</span>
                                    <span class="info-value" th:text="${report.conversationMode != null ? report.conversationMode : '-'}"></span>
                                </div>
                                <div class="info-row">
                                    <span class="info-label">컨텍스트</span>
                                    <span class="info-value" th:text="${report.conversationContextLabel != null ? report.conversationContextLabel : '-'}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<th:block th:replace="admin/fragments :: js" />
</body>
</html>
