plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.17'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.vs.meta'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

ext {
    springCloudVersion = "2021.0.8"
}

ext['tomcat.version'] = '9.0.108'

repositories {
    mavenCentral()
    mavenLocal()
}

configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
    }
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // ===== Spring Boot Starters =====
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // ===== MyBatis =====
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.1'

    // ===== Cache =====
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // ===== Database =====
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    implementation 'org.apache.commons:commons-dbcp2:2.9.0'

    // ===== Swagger =====
    implementation 'org.springdoc:springdoc-openapi-ui:1.7.0'

    // ===== Lombok =====
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // ===== MapStruct =====
    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'

    // ===== Spring Data Commons (Pageable) =====
    implementation 'org.springframework.data:spring-data-commons'

    // ===== PDF (PDFBox) =====
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'
    implementation 'de.rototor.pdfbox:graphics2d:3.0.1'

    // ===== File Upload =====
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-io:commons-io:2.15.1'

    // ===== Apache Commons =====
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.apache.commons:commons-collections4:4.4'

    // ===== Gson =====
    implementation 'com.google.code.gson:gson:2.10.1'

    // ===== Security =====
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.owasp.encoder:encoder:1.2.3'
    implementation 'org.json:json:20240303'

    // ===== OAuth2 Resource Server (JWKS RS256 JWT 검증) =====
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // jjwt 제거 완료 — Auth 서버가 JWT 발급, 학심정은 JWKS 공개키로 검증 (oauth2-resource-server)

    // ===== Test =====
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    testImplementation('org.springframework.security:spring-security-test') {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test']
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8']
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

springBoot {
    buildInfo()
}
